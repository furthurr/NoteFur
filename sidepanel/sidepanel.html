<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <title>NoteFur</title>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">NoteFur</h1>
    <div class="header-actions">
      <button id="btn-export" class="btn btn-ghost btn-icon" type="button" aria-label="Exportar notas" title="Exportar notas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
      </button>
      <button id="btn-import" class="btn btn-ghost btn-icon" type="button" aria-label="Importar notas" title="Importar notas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
      <button id="btn-new" class="btn btn-primary" type="button">+ Nueva nota</button>
    </div>
  </header>

  <input id="file-import" type="file" accept="application/json,.json" hidden />

  <main id="notes-list" class="notes-list" aria-label="Lista de notas"></main>

  <section id="editor" class="editor hidden" aria-label="Editor de nota">
    <div class="editor-head">
      <button id="btn-back" class="btn btn-ghost" type="button">&larr; Volver</button>
      <span id="save-status" class="save-status" aria-live="polite"></span>
      <button id="btn-delete" class="btn btn-danger btn-icon" type="button" aria-label="Eliminar" title="Eliminar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
          <path d="M10 11v6"/>
          <path d="M14 11v6"/>
          <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
        </svg>
      </button>
    </div>
    <input id="note-title" class="editor-title" type="text" placeholder="Título" maxlength="200" />
    <textarea id="note-body" class="editor-body" placeholder="Escribe tu nota aquí&hellip;"></textarea>
  </section>

  <div id="import-dialog" class="modal hidden" role="dialog" aria-labelledby="import-dialog-title" aria-modal="true">
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-content">
      <h2 id="import-dialog-title" class="modal-title">Importar notas</h2>
      <p id="import-dialog-summary" class="modal-summary"></p>
      <p class="modal-hint">Elige cómo quieres importar las notas del archivo.</p>
      <div class="modal-actions">
        <button id="import-cancel" class="btn btn-ghost" type="button">Cancelar</button>
        <button id="import-merge" class="btn btn-primary" type="button">Combinar</button>
        <button id="import-replace" class="btn btn-danger" type="button">Reemplazar todas</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="alert"></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
